name: Build and deploy NeuroLens

# One Docker image = Angular dashboard + FastAPI API + model inference.
# Tests → build and push to Azure Container Registry → trigger the Azure Web App to pull the new image
# → wait until the live site reports this commit.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ACR_USERNAME               Azure Container Registry user name
#   ACR_PASSWORD               Azure Container Registry password
#   AZURE_WEBAPP_WEBHOOK_URL   the Web App's continuous-deployment URL:
#       az webapp deployment container config -g mlprojectdocker -n neurolens-xai --enable-cd true --query CI_CD_URL -o tsv

on:
  push:
    branches: [main]
    paths-ignore:
      - 'research/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-neurolens
  cancel-in-progress: false

env:
  REGISTRY: mlprojectdocker.azurecr.io
  IMAGE: neurolens
  APP_URL: https://neurolens-xai.azurewebsites.net

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # The tests use an in-memory database and a fake model, so TensorFlow is not installed here
      - name: Install dependencies
        working-directory: backend
        run: |
          grep -v -i '^tensorflow' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest httpx mongomock

      - name: Run tests
        working-directory: backend
        run: pytest -q

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push (dashboard + API in one image)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Web App has continuous deployment enabled; calling its webhook makes it pull the new `latest` image.
      - name: Tell the Azure Web App to deploy the new image
        env:
          WEBHOOK: ${{ secrets.AZURE_WEBAPP_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Secret AZURE_WEBAPP_WEBHOOK_URL is not set — see the comment at the top of this workflow."
            exit 1
          fi
          curl -sf -X POST -m 60 "$WEBHOOK" -o /dev/null && echo "Deployment triggered"

  verify-deployment:
    name: Verify live deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the web app to run this commit
        run: |
          # Azure pulls the new image after the registry webhook fires; TensorFlow start-up can take a few minutes.
          for i in $(seq 1 60); do
            body=$(curl -s -m 20 "$APP_URL/api/health" || true)
            echo "[$i] $body"
            if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\""; then
              echo "Deployed commit ${GITHUB_SHA} is live at $APP_URL"
              exit 0
            fi
            sleep 20
          done
          echo "::error::The web app did not report commit ${GITHUB_SHA} within 20 minutes. Check the Web App's log stream in the Azure portal."
          exit 1

      - name: Check the dashboard is served
        run: |
          curl -sf -m 20 "$APP_URL/" | grep -q "<app-root" && echo "Dashboard OK"
